<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Models · WeatherWorld</title>
  <!-- The model page (/models, js/pages/modelPage.js): the short range model's runs and the ensemble behind
       each outlook, on the game map. The same runs across the whole large-scale model are at
       /models/large-scale (synoptic.html). Laid out as the site's other map tools are (css/site.css). -->
  <!--site:head-->
  <style>
    .mdl-products { display: flex; flex-direction: column; gap: 1px; }
    .mdl-products h4 { margin: 10px 0 3px; color: var(--ink-2); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .mdl-products h4:first-child { margin-top: 0; }
    .bench .mdl-products button { text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 4px 8px; font-weight: 500; font-size: 14.5px; color: var(--ink); }
    .bench .mdl-products button:hover { background: var(--band); }
    .bench .mdl-products button.on { background: var(--band); border-left-color: var(--brand); color: var(--ink); font-weight: 700; }
    @media (prefers-color-scheme: dark) { .bench .mdl-products button.on { border-left-color: var(--link); } }
    .mdl-main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px; height: calc(100vh - 235px); min-height: 600px; }
    .mdl-main .chart { height: auto; min-height: 0; }
    #modelCanvas { cursor: crosshair; }
    .mdl-legend { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    #legendBar { width: min(640px, 100%); height: 14px; display: block; }
    #legendTicks { position: relative; width: min(640px, 100%); height: 15px; font: 400 12px var(--mono); color: var(--ink-2); }
    #legendTicks span { position: absolute; transform: translateX(-50%); }
    #legendNote { font-size: 13px; color: var(--ink-2); }
    .mdl-time { display: flex; flex-direction: column; gap: 6px; }
    .mdl-time-row { display: flex; align-items: center; gap: 8px; }
    .mdl-time-row input[type=range] { flex: 1; width: auto; min-width: 0; }
    .mdl-time-row small { font: 400 13.5px var(--mono); color: var(--ink-2); min-width: 70px; text-align: right; }
    #hourStrip { display: flex; flex-wrap: wrap; gap: 3px; }
    .bench #hourStrip button { min-width: 36px; padding: 2px 4px; font: 400 12.5px var(--mono); color: var(--ink-2); }
    .bench #hourStrip button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .bench #hourStrip button.shared { border-bottom: 2px solid #2e9e55; }
    @media (max-width: 900px) {
      .mdl-main { height: auto; min-height: 0; grid-template-rows: auto auto auto auto; }
      .mdl-main .chart { aspect-ratio: 1; }
      .mdl-time-row small { max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bench #hourStrip button { min-width: 42px; padding: 6px 4px; }
      .bench .mdl-products button { padding: 9px 8px; }
    }
  </style>
</head>
<body class="doc" data-page="models">
<!--site:header-->
<main id="content" class="wrap wrap--wide">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span>Models</span></nav>
  <div class="tool-head">
    <div>
      <h1>Models</h1>
      <p class="stamp">Forecast runs of the same engine that runs the world</p>
    </div>
    <nav class="tabs" aria-label="Models">
      <a href="/models" aria-current="page">Short range and ensemble</a><a href="/models/large-scale">Large-scale view</a>
    </nav>
  </div>
  <hr class="tool-rule" />
  <div class="bench">
    <aside class="bench__side" aria-label="Controls">
      <section class="group">
        <h2>Model</h2>
        <div class="row-2">
          <button id="modelShort" class="on" title="One run from the live world each hour">Short range</button>
          <button id="modelEnsemble" title="The runs behind the latest outlook">Ensemble</button>
        </div>
        <select id="runSelect" aria-label="Run"></select>
        <label><input type="checkbox" id="followLatest" checked /> Follow the newest run</label>
        <small id="runNote">Connecting…</small>
        <small><a href="/models/large-scale">See a run across the whole large-scale model</a></small>
      </section>
      <section class="group">
        <h2>Products</h2>
        <div class="mdl-products" id="productList"></div>
      </section>
      <section class="group">
        <h2>Show</h2>
        <label><input type="checkbox" id="showCounties" checked /> Counties and towns</label>
        <label><input type="checkbox" id="showContours" checked /> Contours on the fields</label>
        <label title="For Composite reflectivity + UH tracks">UH tracks above <select id="uhLeast" style="width:auto;flex:1"></select></label>
      </section>
      <section class="group">
        <h2>About these models</h2>
        <p class="note" id="aboutNote" style="margin:0"></p>
      </section>
    </aside>
    <div class="bench__main mdl-main">
      <div class="chart-title"><strong id="mapTitle">—</strong><small id="mapValid">—</small></div>
      <div class="chart"><canvas id="modelCanvas"></canvas><div id="modelTip" class="chart__tip"></div></div>
      <div class="mdl-legend"><canvas id="legendBar" width="640" height="14"></canvas><div id="legendTicks"></div><div id="legendNote"></div></div>
      <div class="mdl-time">
        <div class="mdl-time-row">
          <button id="stepBack" title="Earlier (←)">◀</button>
          <button id="play" title="Play (space)">Play</button>
          <button id="stepNext" title="Later (→)">▶</button>
          <input type="range" id="timeSlider" min="0" max="0" value="0" step="15" aria-label="Forecast time" />
          <small id="timeLabel">F000</small>
        </div>
        <div id="hourStrip"></div>
      </div>
    </div>
  </div>
</main>
<!--site:footer-->
<script type="module" src="./js/pages/modelPage.js"></script>
</body>
</html>
