[package]
name = "alex15ftc/weatherworld"
description = "WeatherWorld Roblox place"
version = "0.1.0"
registry = "https://github.com/upliftgames/wally-index"
realm = "shared"

[dependencies]
Trove = "sleitnick/trove@1.8.0"
Future = "red-blox/future@1.0.1"
Ripple = "littensy/ripple@0.9.0"
