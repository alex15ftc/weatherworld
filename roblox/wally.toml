# React (jsdotlua 17.2.1 — what Packages.React / Packages.ReactRoblox actually resolve to)
React = "haedrix/react@17.3.10"
React-Roblox = "haedrix/react-roblox@17.3.10"
React-Debug-Tools = "haedrix/react-debug-tools@17.3.10"

