<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day 1 Convective Outlook · Fake Plains Weather</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <style>
    body { display: grid; grid-template-columns: 310px minmax(0, 1fr) 470px; height: 100vh; overflow: hidden; }
    .outlook-side { display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line); padding-top: 64px; }
    .outlook-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; }
    .outlook-card > span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
    .outlook-card strong { font-size: 21px; }
    .outlook-card small { color: var(--muted); }
    #layerButtons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    #layerButtons button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font: inherit; font-weight: 700; cursor: pointer; }
    #layerButtons button:hover { border-color: var(--accent); }
    #layerButtons button.on { background: #2563eb; border-color: #2563eb; }
    #legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
    #legend li { display: flex; align-items: center; gap: 8px; }
    #legend b { margin-left: auto; color: var(--muted); font-weight: 600; }
    #legend i { flex: none; display: inline-block; width: 22px; height: 13px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, .5); }
    #legend i.hatch { background: repeating-linear-gradient(45deg, #1f2937 0 2px, #cbd5e1 2px 6px); }
    #legend i.hatch.cross { background: repeating-linear-gradient(45deg, #1f2937 0 2px, transparent 2px 6px), repeating-linear-gradient(-45deg, #1f2937 0 2px, #cbd5e1 2px 6px); }
    #facts { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 13px; }
    #facts span { color: var(--muted); } #facts b { text-align: right; }
    .outlook-map { position: relative; min-width: 0; min-height: 0; padding: 70px 12px 12px; display: flex; align-items: center; justify-content: center; }
    #outlookCanvas { display: block; border-radius: 6px; }
    .outlook-text { border-left: 1px solid var(--line); padding-top: 64px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
    #discussion { margin: 0; white-space: pre-wrap; font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text); }
    @media (max-width: 1100px) { body { grid-template-columns: 1fr; grid-template-rows: auto 70vh auto; height: auto; overflow: auto; } .outlook-map { padding-top: 12px; } }
  </style>
</head>
<body data-page="day1">
<nav class="product-nav" aria-label="Weather products"><a data-nav-page="live" href="./index.html">Live analysis</a><a data-nav-page="day1" class="active" href="./day1.html">Day 1</a><a data-nav-page="day2" href="./day2.html">Day 2</a><a data-nav-page="day3" href="./day3.html">Day 3</a><a data-nav-page="radar" href="./radar.html">Radar</a><a class="perf-link" href="./performance.html">Performance</a></nav>
  <aside class="panel outlook-side">
    <div class="outlook-card">
      <span>Day 1 convective outlook</span>
      <strong id="headline">—</strong>
      <small id="issue">—</small>
    </div>
    <div class="outlook-card">
      <span>Map</span>
      <div id="layerButtons"></div>
    </div>
    <div class="outlook-card">
      <span>Legend</span>
      <ul id="legend"></ul>
      <small id="legendNote"></small>
    </div>
    <div class="outlook-card">
      <span>From the forecast runs</span>
      <div id="facts"></div>
    </div>
  </aside>
  <main class="outlook-map"><canvas id="outlookCanvas"></canvas></main>
  <aside class="panel outlook-text">
    <p class="eyebrow">Forecast discussion</p>
    <pre id="discussion"></pre>
  </aside>
  <script type="module" src="./js/pages/outlookPage.js"></script>
</body>
</html>
