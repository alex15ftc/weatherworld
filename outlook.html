<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convective Outlook · WeatherWorld</title>
  <!-- The public Day 1-3 outlook page (server/OutlookPublic.js); /outlook/day1, /outlook/day2, /outlook/day3. -->
  <style>
    :root { color-scheme: dark; --bg: #0b1017; --panel: #141b24; --panel-2: #1b2531; --line: #2c3948; --text: #f4f7fb; --muted: #96a5b7; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    nav.product-nav { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #0f172a; }
    nav.product-nav a { color: #cbd5e1; text-decoration: none; padding: 7px 12px; border-radius: 8px; font-size: .85rem; font-weight: 700; }
    nav.product-nav a:hover, nav.product-nav a.active { background: var(--accent); color: #fff; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
    header h1 { margin: 0 0 4px; font-size: 1.6rem; }
    header p { margin: 0; color: var(--muted); }
    .risk { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 6px; font-weight: 800; color: #111; letter-spacing: .03em; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 12px; }
    .tabs button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    .tabs button.on { background: var(--accent); border-color: var(--accent); }
    .map { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    .map img { display: block; width: 100%; height: auto; border-radius: 6px; background: #fff; }
    .discussion { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
    .discussion h2 { margin: 0 0 10px; font-size: 1.1rem; }
    .discussion pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font: 14px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; color: #dbe4ee; }
    .status { color: var(--muted); font-size: .9rem; margin-top: 8px; }
  </style>
</head>
<body>
<nav class="product-nav" aria-label="Weather products">
  <a href="/outlook/day1" data-day="day1">Day 1</a><a href="/outlook/day2" data-day="day2">Day 2</a><a href="/outlook/day3" data-day="day3">Day 3</a>
  <a href="/index.html">Live analysis</a><a href="/models.html">Models</a>
</nav>
<main>
  <header>
    <h1 id="title">Convective Outlook</h1>
    <p id="times">Loading…</p>
    <span id="risk" class="risk" hidden></span>
  </header>
  <div class="tabs" id="tabs">
    <button data-hazard="categorical" class="on">Categorical</button>
    <button data-hazard="tornado">Tornado</button>
    <button data-hazard="wind">Wind</button>
    <button data-hazard="hail">Hail</button>
  </div>
  <div class="map"><img id="map" alt="Outlook map" width="1000" height="1098" /></div>
  <p class="status" id="status"></p>
  <section class="discussion"><h2>Forecast discussion</h2><pre id="discussion"></pre></section>
</main>
<script type="module">
const COLOURS = { TSTM: '#c1e9c1', MRGN: '#66a366', SLGT: '#ffe066', ENH: '#ffa366', MDT: '#e06666', HIGH: '#ee99ee' };
const day = (location.pathname.match(/day[123]/) ?? ['day1'])[0], n = day.slice(3);
// Day 3 is categorical only (no hazard maps), as SPC's Day 3.
let hazard = n === '3' ? 'categorical' : new URLSearchParams(location.search).get('hazard') ?? 'categorical', version = null;
if (n === '3') document.querySelector('#tabs').style.display = 'none';
document.querySelectorAll('nav a[data-day]').forEach(a => a.classList.toggle('active', a.dataset.day === day));
document.title = `Day ${n} Convective Outlook · WeatherWorld`;
document.querySelector('#title').textContent = `Day ${n} Convective Outlook`;
const showMap = () => { document.querySelector('#map').src = `/api/outlook/${day}.svg?hazard=${hazard}&v=${version ?? ''}`; };
document.querySelectorAll('#tabs button').forEach(b => {
  b.classList.toggle('on', b.dataset.hazard === hazard);
  b.onclick = () => { hazard = b.dataset.hazard; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); history.replaceState(null, '', hazard === 'categorical' ? location.pathname : `?hazard=${hazard}`); showMap(); };
});
// World hours are shown with the real date they fall on, from the server's clock (js/pageCalendar.js).
const { loadCalendar, dateText } = await import('/js/pageCalendar.js');
const stamp = h => { const z = (((h % 24) + 24) % 24) + 1e-6; return `${String(Math.floor(z)).padStart(2, '0')}${String(Math.floor((z % 1) * 60)).padStart(2, '0')} UTC ${dateText(h)}`.trim(); };
async function load() {
  try {
    const res = await fetch(`/api/outlook/${day}`, { cache: 'no-store' });
    const o = await res.json();
    if (o.status !== 'issued') { document.querySelector('#times').textContent = o.status === 'running' ? 'The outlook is being prepared.' : 'No outlook has been issued yet.'; showMap(); return; }
    const changed = res.headers.get('x-product-version') !== version;
    version = res.headers.get('x-product-version');
    document.querySelector('#times').textContent = `Issued ${stamp(o.issuedHourUtc)} · Valid ${stamp(o.validFromHourUtc)} to ${stamp(o.validToHourUtc)}`;
    const risk = document.querySelector('#risk');
    risk.hidden = !COLOURS[o.highest]; risk.textContent = (o.headline ?? '').toUpperCase(); risk.style.background = COLOURS[o.highest] ?? '';
    document.querySelector('#discussion').textContent = o.discussion ?? '';
    // While an update runs the page keeps showing this issue; it changes when the new one is out.
    document.querySelector('#status').textContent = o.nextUpdateHourUtc != null ? `Next update ${stamp(o.nextUpdateHourUtc)}.` : '';
    if (changed) showMap();
  } catch (error) {
    document.querySelector('#status').textContent = `Could not reach the weather server (${error.message}).`;
  }
}
loadCalendar().then(load);
setInterval(load, 60_000);
</script>
</body>
</html>
