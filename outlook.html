<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convective Outlook · WeatherWorld</title>
  <!-- The public Day 1-3 outlook page (server/OutlookPublic.js): /outlooks, /outlook/day1, /outlook/day2, /outlook/day3. -->
  <!--site:head-->
  <style>
    .outlook-map { position: sticky; top: 16px; }
    @media (max-width: 860px) { .outlook-map { position: static; } }
    .summary { font-size: 20px; line-height: 1.4; font-weight: 600; margin: 0 0 14px; }
  </style>
</head>
<body class="doc">
<!--site:header-->
<main id="content" class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span><a href="/outlooks">Outlooks</a></span><span id="crumb">Day 1</span></nav>
  <header class="page-head">
    <h1 id="title">Convective Outlook</h1>
    <p class="stamp" id="times">Loading…</p>
  </header>
  <nav class="tabs" aria-label="Outlook day">
    <a href="/outlook/day1" data-day="day1">Day 1</a><a href="/outlook/day2" data-day="day2">Day 2</a><a href="/outlook/day3" data-day="day3">Day 3</a>
  </nav>
  <div class="split split--map">
    <div class="outlook-map">
      <div class="tabs tabs--small" id="tabs" role="tablist" aria-label="Hazard"></div>
      <figure class="map">
        <a id="mapLink"><img id="map" alt="Outlook map" width="1000" height="1098" /></a>
        <figcaption id="status"></figcaption>
      </figure>
    </div>
    <div>
      <p id="risk"></p>
      <p class="summary" id="sentence"></p>
      <dl class="facts" id="facts"></dl>
      <section class="section">
        <h2>Forecast discussion</h2>
        <pre class="bulletin" id="discussion"></pre>
      </section>
      <nav class="pager" id="pager"></nav>
    </div>
  </div>
</main>
<!--site:footer-->
<script type="module">
import { $, getJson, loadCalendar, utcText, localText, riskTag, escapeHtml } from '/js/site.js';
const day = (location.pathname.match(/day[123]/) ?? ['day1'])[0], n = Number(day.slice(3));
// The maps a day has: its categorical outlook and one for each of its hazards (Days 1 and 2: tornado, wind and
// hail; Day 3: one chance of any severe weather, as the real Day 3).
const HAZARD_NAMES = { categorical: 'Categorical', tornado: 'Tornado', wind: 'Wind', hail: 'Hail', severe: 'Severe' };
let hazard = new URLSearchParams(location.search).get('hazard') ?? 'categorical', version = null, shown = '';
document.querySelectorAll('.tabs a[data-day]').forEach(a => { if (a.dataset.day === day) a.setAttribute('aria-current', 'page'); });
document.title = `Day ${n} Convective Outlook · WeatherWorld`;
$('#title').textContent = `Day ${n} Convective Outlook`;
$('#crumb').textContent = `Day ${n}`;
$('#pager').innerHTML = `${n > 1 ? `<a href="/outlook/day${n - 1}">‹ Day ${n - 1} outlook</a>` : '<span></span>'}${n < 3 ? `<a href="/outlook/day${n + 1}">Day ${n + 1} outlook ›</a>` : '<span></span>'}`;
const showMap = () => { const src = `/api/outlook/${day}.svg?hazard=${hazard}&v=${version ?? ''}`; $('#map').src = src; $('#mapLink').href = `/api/outlook/${day}.svg?hazard=${hazard}&times=1`; };
const mark = () => document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.hazard === hazard)));
function showTabs(order) {
  const list = ['categorical', ...order.filter(h => HAZARD_NAMES[h])];
  if (!list.includes(hazard)) hazard = 'categorical';
  if (shown !== list.join()) {
    shown = list.join();
    $('#tabs').innerHTML = list.map(h => `<button role="tab" data-hazard="${h}">${HAZARD_NAMES[h]}</button>`).join('');
    document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => { hazard = b.dataset.hazard; mark(); history.replaceState(null, '', hazard === 'categorical' ? location.pathname : `?hazard=${hazard}`); showMap(); }; });
  }
  mark();
}
showTabs(n === 3 ? ['severe'] : ['tornado', 'wind', 'hail']);
async function load() {
  try {
    const o = await getJson(`/api/outlook/${day}`);
    if (o.status !== 'issued') { $('#times').textContent = o.status === 'running' ? 'The outlook is being prepared.' : 'No outlook has been issued yet.'; showMap(); return; }
    const was = hazard;
    showTabs(o.hazardOrder ?? []);
    const changed = o.__version !== version || was !== hazard;
    version = o.__version;
    $('#times').innerHTML = `<b>Issued</b> ${escapeHtml(utcText(o.issuedHourUtc))} (${localText(o.issuedHourUtc)})<br><b>Valid</b> ${escapeHtml(utcText(o.validFromHourUtc))} to ${escapeHtml(utcText(o.validToHourUtc))}`;
    $('#risk').innerHTML = riskTag(o.highest);
    const text = o.discussion ?? '';
    const summary = text.match(/\.\.\.SUMMARY\.\.\.\n([\s\S]*?)(?:\n\n|$)/)?.[1]?.replace(/\n/g, ' ') ?? '';
    $('#sentence').textContent = summary.split(/(?<=\.)\s/)[0] ?? '';
    const hazards = summary.match(/The main hazards: (.*?)\.(?:\s|$)/)?.[1], greatest = summary.match(/The greatest risk is (.*?)\.(?:\s|$)/)?.[1];
    $('#facts').innerHTML = [['Main hazards', hazards], ['Greatest risk', greatest], ['Next update', o.nextUpdateHourUtc != null ? `${utcText(o.nextUpdateHourUtc)} (${localText(o.nextUpdateHourUtc)})` : null]]
      .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`).join('');
    $('#discussion').textContent = text;
    $('#status').textContent = o.updating ? 'An update is being prepared; this is the latest issue.' : 'Select the map to open it with its issue and valid times, ready to share.';
    if (changed) showMap();
  } catch (error) {
    $('#status').textContent = `Could not reach the weather server (${error.message}).`;
  }
}
loadCalendar().then(load);
setInterval(load, 60_000);
</script>
</body>
</html>
