<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Storm Meshes · Fake Plains Weather</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <style>
    body { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; overflow: hidden; margin: 0; }
    .ms-side { display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line); padding: 14px; overflow: auto; }
    .ms-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 8px; }
    .ms-card > span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
    .ms-card label { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 8px; font-size: 12.5px; }
    .ms-card label output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    .ms-card select, .ms-card button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
    .ms-row { display: flex; gap: 6px; flex-wrap: wrap; }
    #info { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }
    #view { position: relative; min-width: 0; min-height: 0; }
    #view canvas { display: block; width: 100%; height: 100%; }
    .ms-hint { position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 12px; text-shadow: 0 1px 2px #0008; }
    @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height: auto; overflow: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <aside class="panel ms-side">
    <div class="ms-card">
      <span>Mesh</span>
      <select id="mesh"></select>
      <div class="ms-row">
        <button id="single">One</button><button id="grid">Variants</button><button id="scene">Storm scene</button>
      </div>
      <label>Seed <input id="seed" type="range" min="1" max="60" step="1" value="1" /><output id="seedOut">1</output></label>
    </div>
    <div class="ms-card" id="settingsCard"><span>Shape</span><div id="settings"></div></div>
    <div class="ms-card" id="tornadoCard" hidden>
      <span>Replay tornado</span>
      <label>Frame <input id="frame" type="range" min="1" max="1" step="0.05" value="1" /><output id="frameOut">1</output></label>
      <div class="ms-row"><button id="play">Play</button></div>
    </div>
    <div class="ms-card"><span>About</span><pre id="info"></pre></div>
  </aside>
  <main id="view"><div class="ms-hint">Drag to orbit · scroll to zoom · right-drag to pan</div></main>
  <script type="module" src="./js/pages/meshesPage.js"></script>
</body>
</html>
